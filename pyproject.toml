[tool.poetry]
name = "smart-traffic-vision"
version = "0.1.0"
description = "End-to-end Computer Vision system for traffic object detection using YOLOv8"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
